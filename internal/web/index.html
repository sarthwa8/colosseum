<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Colosseum — AI coding battleground</title>
<style>
  :root {
    --bg:#0f0e0c; --panel:#1a1815; --line:#2e2a24; --ink:#e9e2d4; --dim:#8a8172;
    --amber:#e0a34a; --red:#d9534f; --green:#5aa469; --blue:#5a8fb0;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:14px; }
  header h1 { margin:0; font-size:18px; letter-spacing:2px; }
  header h1 .swords { color:var(--amber); }
  header .sub { color:var(--dim); font-size:12px; }
  .wrap { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 51px); }
  aside { border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--dim); margin:14px 4px 8px; }
  .match { padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    margin-bottom:6px; cursor:pointer; background:var(--panel); }
  .match:hover { border-color:var(--amber); }
  .match .m-top { display:flex; justify-content:space-between; font-size:11px; color:var(--dim); }
  .match .m-models { margin-top:3px; }
  .match .win { color:var(--green); }
  .board { font-size:12px; }
  .board .row { display:flex; justify-content:space-between; padding:3px 4px; border-bottom:1px dashed var(--line); }
  main { overflow-y:auto; padding:18px 22px; }
  .arena-empty { color:var(--dim); text-align:center; margin-top:80px; }
  .title { font-size:16px; margin:0 0 4px; }
  .controls { margin:8px 0 16px; color:var(--dim); font-size:12px; display:flex; gap:12px; align-items:center; }
  .controls button { background:var(--panel); color:var(--ink); border:1px solid var(--line);
    padding:4px 10px; border-radius:5px; cursor:pointer; font:inherit; }
  .controls button:hover { border-color:var(--amber); }
  .fighters { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .fighter { border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:12px; }
  .fighter.win { border-color:var(--green); box-shadow:0 0 0 1px var(--green) inset; }
  .fighter h3 { margin:0 0 2px; font-size:14px; }
  .fighter .who { color:var(--dim); font-size:11px; }
  .fighter .status { margin:8px 0; min-height:18px; color:var(--amber); font-size:12px; }
  .badges { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  .badge { font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); }
  .badge.AC { color:var(--green); border-color:var(--green); }
  .badge.WA,.badge.RE,.badge.CE { color:var(--red); border-color:var(--red); }
  .badge.TLE,.badge.MLE,.badge.OLE { color:var(--amber); border-color:var(--amber); }
  pre.code { background:#0b0a09; border:1px solid var(--line); border-radius:6px;
    padding:8px; font-size:11px; max-height:150px; overflow:auto; white-space:pre-wrap; color:#cbb; }
  .tags { margin-top:6px; font-size:11px; }
  .tag { display:inline-block; margin-right:8px; }
  .tag.broke { color:var(--green); }
  .tag.shielded { color:var(--blue); }
  .feed { margin-top:16px; border-top:1px solid var(--line); padding-top:10px; }
  .feed h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  .ev { font-size:12px; padding:2px 0; color:var(--dim); }
  .ev b { color:var(--ink); }
  .outcome { margin-top:14px; padding:10px 14px; border:1px solid var(--amber);
    border-radius:8px; background:#1d1913; font-size:14px; }
  .outcome .w { color:var(--green); font-weight:bold; }
</style>
</head>
<body>
<header>
  <h1><span class="swords">⚔</span> COLOSSEUM</h1>
  <span class="sub">AI coding battleground · replays render from the event log</span>
</header>
<div class="wrap">
  <aside>
    <h2>Leaderboard</h2>
    <div id="board" class="board"><div class="row"><span>—</span></div></div>
    <h2>Matches</h2>
    <div id="matches"></div>
  </aside>
  <main>
    <div id="arena" class="arena-empty">Select a match to replay it.</div>
  </main>
</div>

<script>
const V = t => `<span class="badge ${t}">${t}</span>`;
let timer = null, speed = 4;

async function loadMatches() {
  const res = await fetch('/api/matches');
  const list = await res.json();
  const el = document.getElementById('matches');
  if (!list.length) { el.innerHTML = '<div class="ev">No matches yet. Run <code>colosseum match ...</code></div>'; return; }
  el.innerHTML = list.map(m => `
    <div class="match" data-id="${m.id}">
      <div class="m-top"><span>${m.format}</span><span>${m.problem}</span></div>
      <div class="m-models">${(m.models||[]).join(' vs ')}</div>
      <div class="m-top"><span class="win">${m.winner ? '▶ '+m.winner : 'draw'}</span><span>${m.reason}</span></div>
    </div>`).join('');
  el.querySelectorAll('.match').forEach(d =>
    d.addEventListener('click', () => replay(d.dataset.id)));
}

async function loadBoard() {
  try {
    const rep = await fetch('/api/report').then(r => r.json());
    if (!rep.models) return;
    const rows = rep.models.map(m => {
      const elo = (rep.robustness_elo && rep.robustness_elo[m.model]) || {};
      const r = elo.rating ? Math.round(elo.rating) : '—';
      return `<div class="row"><span>${m.model}</span><span>${Math.round(m.solve_rate*100)}% · Elo ${r}</span></div>`;
    }).join('');
    document.getElementById('board').innerHTML = rows || '<div class="row"><span>—</span></div>';
  } catch (e) {}
}

function fighterCard(side, model) {
  return `<div class="fighter" id="f-${side}">
    <h3>${side}</h3><div class="who">${model||''}</div>
    <div class="status" id="s-${side}"></div>
    <div class="badges" id="b-${side}"></div>
    <div class="tags" id="t-${side}"></div>
    <pre class="code" id="c-${side}" style="display:none"></pre>
  </div>`;
}

async function replay(id) {
  if (timer) { clearTimeout(timer); timer = null; }
  const rec = await fetch('/api/matches/' + id).then(r => r.json());
  const man = rec.manifest, fs = man.fighters || {};
  const arena = document.getElementById('arena');
  arena.className = '';
  arena.innerHTML = `
    <div class="title">${rec.events?.[1]?.payload?.title || man.problem} · <span style="color:var(--dim)">${man.format}</span></div>
    <div class="controls">
      <button id="restart">↻ replay</button>
      <span>speed</span>
      <button data-s="0">instant</button><button data-s="4">4×</button><button data-s="1">1×</button>
      <span id="mid" style="color:var(--dim)"></span>
    </div>
    <div class="fighters">${fighterCard('A', fs.A?.model)}${fighterCard('B', fs.B?.model)}</div>
    <div class="feed"><h2>Event log</h2><div id="feed"></div></div>
    <div id="outcome"></div>`;
  document.getElementById('restart').onclick = () => runEvents(rec);
  arena.querySelectorAll('[data-s]').forEach(b =>
    b.onclick = () => { speed = +b.dataset.s; runEvents(rec); });
  runEvents(rec);
}

function reset(side) {
  ['s','b','t'].forEach(p => document.getElementById(p+'-'+side).innerHTML = '');
  const c = document.getElementById('c-'+side); c.style.display='none'; c.textContent='';
  document.getElementById('f-'+side).className = 'fighter';
}

function runEvents(rec) {
  if (timer) { clearTimeout(timer); timer = null; }
  reset('A'); reset('B');
  document.getElementById('feed').innerHTML = '';
  document.getElementById('outcome').innerHTML = '';
  const evs = rec.events || [];
  let i = 0, prev = null;
  const step = () => {
    if (i >= evs.length) return;
    const e = evs[i++];
    apply(e, rec);
    const next = evs[i];
    let delay = 0;
    if (speed > 0 && next) {
      delay = Math.min(800, (new Date(next.at) - new Date(e.at)) / speed);
      if (!(delay > 0)) delay = 40;
    }
    timer = setTimeout(step, delay);
  };
  step();
}

function feed(html) {
  const f = document.getElementById('feed');
  const d = document.createElement('div'); d.className = 'ev'; d.innerHTML = html;
  f.appendChild(d); f.scrollTop = f.scrollHeight;
}

function apply(e, rec) {
  const p = e.payload || {}, who = e.actor;
  switch (e.type) {
    case 'phase_started':
      feed(`<span style="color:var(--amber)">▸ ${p.phase}${p.attacker?` (${p.attacker}→${p.defender})`:''}</span>`);
      break;
    case 'fighter_thinking':
      if (who==='A'||who==='B') document.getElementById('s-'+who).textContent = 'thinking… (iter '+p.iteration+')';
      break;
    case 'fighter_code':
      if (who==='A'||who==='B') { const c=document.getElementById('c-'+who); c.style.display='block'; c.textContent=p.code||''; }
      break;
    case 'submission': {
      if (who==='A'||who==='B') {
        document.getElementById('b-'+who).innerHTML += V(p.verdict);
        document.getElementById('s-'+who).textContent = `${p.verdict} — ${p.passed}/${p.total} tests`;
      }
      feed(`<b>${who}</b> → ${p.verdict} ${p.passed}/${p.total}`);
      break;
    }
    case 'attack_submitted':
      feed(`<b>${who}</b> attacks with input <code>${(p.input||'').replace(/\n/g,'⏎').slice(0,50)}</code>`);
      break;
    case 'attack_result': {
      const t = document.getElementById('t-'+who);
      if (p.broke) t.innerHTML += `<span class="tag broke">⚔ broke defender</span>`;
      else t.innerHTML += `<span class="tag shielded">shielded</span>`;
      feed(`<b>${who}</b> ${p.broke?'<span style="color:var(--green)">BROKE DEFENDER</span>':'shielded'} — ${p.detail||''}`);
      break;
    }
    case 'fighter_forfeit':
      if (who==='A'||who==='B') document.getElementById('s-'+who).textContent = 'forfeit: '+p.reason;
      feed(`<b>${who}</b> forfeit: ${p.reason}`);
      break;
    case 'match_finished': {
      const o = rec.outcome || {};
      const wid = o.winner_id;
      let wmodel = 'draw';
      if (wid && o.scores && o.scores[wid]) { wmodel = o.scores[wid].model; document.getElementById('f-'+wid).classList.add('win'); }
      document.getElementById('outcome').innerHTML =
        wid ? `<div class="outcome"><span class="w">WINNER: ${wmodel}</span> — ${o.reason}</div>`
            : `<div class="outcome">DRAW — ${o.reason}</div>`;
      break;
    }
  }
}

loadMatches(); loadBoard();
setInterval(() => { loadMatches(); loadBoard(); }, 5000);
</script>
</body>
</html>
