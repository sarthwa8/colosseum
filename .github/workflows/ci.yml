name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # ships with a working Docker engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Pre-pull the sandbox image
        run: docker pull python:3.12-alpine

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Runs the full suite, including the sandbox security suite (fork bomb,
      # OOM, network-exfil, fs-escape) against real containers.
      - name: Test
        run: go test -v ./...

  # The spectator UI is a Vite bundle committed under internal/web/dist so
  # `go build` works without a Node toolchain. That means the committed bundle
  # can silently drift from web/src — this job fails if it has.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Committed bundle is up to date
        run: |
          if ! git diff --quiet -- internal/web/dist; then
            echo "::error::internal/web/dist is stale — run 'npm run build' in web/ and commit the result."
            git diff --stat -- internal/web/dist
            exit 1
          fi
